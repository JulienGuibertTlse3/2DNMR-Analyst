name: R Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Annule les runs précédents encore en cours sur la même branche/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Le projet R (et renv.lock) vit dans le sous-dossier APPIN_1.0.0/.
    defaults:
      run:
        working-directory: APPIN_1.0.0

    env:
      R_KEEP_PKG_SOURCE: yes
      CI: true
      # Empêche reticulate d'initialiser Python/keras : les tests CNN
      # doivent passer en "skipped", pas planter le job.
      RETICULATE_PYTHON: ""
      # renv ne tente pas d'amorcer Python pour reticulate.
      RENV_CONFIG_RETICULATE_ENABLED: "FALSE"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # R 4.2.2 = meme version que ton Dockerfile (rocker/geospatial:4.2.2)
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2.2'
          use-public-rspm: true

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make pandoc libx11-dev libcurl4-openssl-dev libssl-dev \
            zlib1g-dev libglpk-dev libxml2-dev libfftw3-dev libicu-dev \
            libjpeg-dev libpng-dev libtiff-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev

      # Restaure l'environnement renv depuis renv.lock (memes versions que la prod).
      - name: Restore renv
        uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: APPIN_1.0.0

      # Filet de securite : bsicons est utilise par les tests mais absent du
      # renv.lock actuel. A terme, l'ajouter au lock (renv::record("bsicons")).
      - name: Ensure test-only packages present
        run: |
          Rscript -e 'if (!requireNamespace("bsicons", quietly = TRUE)) install.packages("bsicons")'

      # Retire les packages ML pour que les tests CNN skippent (skip_if_not_installed).
      - name: Drop ML packages so CNN tests skip
        run: |
          Rscript -e 'for (p in c("keras","tensorflow","tfruns","tfautograph")) try(remove.packages(p), silent = TRUE)'

      - name: Run unit tests
        run: |
          Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
