name: R Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # jammy : aligne avec le Posit Package Manager -> binaires precompiles
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: APPIN_1.0.0

    env:
      R_KEEP_PKG_SOURCE: yes
      CI: true
      # Les tests CNN doivent skipper : on n'installe pas keras/tensorflow
      # et on neutralise reticulate.
      RETICULATE_PYTHON: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make pandoc git \
            libx11-dev libcurl4-openssl-dev libssl-dev libxml2-dev \
            zlib1g-dev libglpk-dev libgmp-dev libicu-dev libfftw3-dev \
            libjpeg-dev libpng-dev libtiff-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev

      # Installation directe des packages (pas de renv).
      # Liste deduite de Shine.R + Function/*.R + tests.
      # keras / tensorflow / reticulate NON installes -> tests CNN skippes.
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::shiny
            any::shinyFiles
            any::shinyjs
            any::shinyBS
            any::shinycssloaders
            any::shinydashboard
            any::shinydashboardPlus
            any::bslib
            any::bsicons
            any::htmltools
            any::DT
            any::plotly
            any::ggplot2
            any::viridis
            any::data.table
            any::dplyr
            any::purrr
            any::magrittr
            any::readr
            any::reshape2
            any::dbscan
            any::zoo
            any::abind
            any::matrixStats
            any::minpack.lm
            any::imager
            any::sp
            any::digest
            any::Rcpp
            any::MASS

      - name: Run unit tests
        run: |
          Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
