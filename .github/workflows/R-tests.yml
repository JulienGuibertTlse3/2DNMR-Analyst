name: R Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Annule les runs précédents encore en cours sur la même branche/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Le projet R vit dans le sous-dossier APPIN_1.0.0/.
    # Toutes les étapes "run" s'exécutent donc depuis ce dossier.
    defaults:
      run:
        working-directory: APPIN_1.0.0

    env:
      R_KEEP_PKG_SOURCE: yes
      # Variable signalant l'environnement CI à tes tests / helpers
      CI: true
      # Empêche reticulate de tenter d'initialiser Python/keras :
      # les tests CNN doivent passer en "skipped", pas planter le job.
      RETICULATE_PYTHON: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: APPIN_1.0.0
          # Dépendances déduites de tes fichiers de test.
          # Les packages ML (keras/tensorflow) ne sont volontairement PAS
          # installés : les tests correspondants utilisent skip_if_not_installed()
          # et passeront donc en "skipped" en CI.
          packages: |
            any::testthat
            any::shiny
            any::shinyFiles
            any::shinyjs
            any::bslib
            any::bsicons
            any::htmltools
            any::DT
            any::plotly
            any::data.table
            any::dplyr
            any::dbscan
            any::digest

      - name: Run unit tests
        run: |
          Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
