name: R Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Ubuntu 22.04 (jammy) : correspond a la base Debian/Ubuntu de ton
    # Dockerfile et evite le decalage noble vu dans le log.
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: APPIN_1.0.0

    env:
      R_KEEP_PKG_SOURCE: yes
      CI: true
      RETICULATE_PYTHON: ""
      RENV_CONFIG_RETICULATE_ENABLED: "FALSE"
      # PPM aligne sur la distrib du runner (jammy) -> binaires precompiles,
      # pas de compilation source qui faisait etouffer l'install.
      RENV_CONFIG_REPOS_OVERRIDE: "https://packagemanager.posit.co/cran/__linux__/jammy/latest"
      # Limite le parallelisme : evite que plusieurs compilations source
      # simultanees ne saturent la RAM du runner et tuent le process.
      MAKEFLAGS: "-j2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2.2'
          use-public-rspm: true

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make pandoc git \
            libx11-dev libcurl4-openssl-dev libssl-dev libxml2-dev \
            zlib1g-dev libglpk-dev libgmp-dev libicu-dev libfftw3-dev \
            libjpeg-dev libpng-dev libtiff-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev

      - name: Restore renv
        uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: APPIN_1.0.0

      - name: Ensure test-only packages present
        run: |
          Rscript -e 'if (!requireNamespace("bsicons", quietly = TRUE)) install.packages("bsicons")'

      - name: Drop ML packages so CNN tests skip
        run: |
          Rscript -e 'for (p in c("keras","tensorflow","tfruns","tfautograph")) try(remove.packages(p), silent = TRUE)'

      - name: Run unit tests
        run: |
          Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
